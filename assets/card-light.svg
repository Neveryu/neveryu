<style>
.cur{animation:blink 1.1s steps(1,end) infinite}
@keyframes blink{0%,49.9%{opacity:1}50%,100%{opacity:0}}
.led{animation:led 2.4s ease-in-out infinite}
@keyframes led{0%,100%{opacity:1}50%{opacity:.35}}
.scan{animation:scan 9.5s linear infinite}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(456px)}}
.typer{animation:type 2.7s steps(27,end) .6s both}
@keyframes type{from{width:0px}to{width:267px}}
@media (prefers-reduced-motion:reduce){.cur,.led,.scan,.typer{animation:none}}
</style>
